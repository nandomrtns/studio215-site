name: Renovar token do Instagram

# O token de longa duração vale 60 dias. Renovar todo dia 1º mantém ele sempre
# com folga. Precisa do secret GH_SECRETS_PAT (token fino com permissão de
# escrita em Secrets deste repositório) — o GITHUB_TOKEN padrão não grava secrets.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar e salvar o token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          resp=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          novo=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$novo" ]; then
            echo "Falha ao renovar: $(echo "$resp" | jq -c '.error // .')"
            exit 1
          fi
          echo "::add-mask::$novo"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$novo"
          echo "Token renovado; vale mais $(( $(echo "$resp" | jq -r '.expires_in') / 86400 )) dias."
