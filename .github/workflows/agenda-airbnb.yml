name: Agenda do Airbnb

# Lê o calendário exportado do Airbnb e grava assets/agenda.json (só datas).
# Usado pelo calendário do site e para achar datas vazias para a oferta relâmpago.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-airbnb
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/agenda.mjs
        env:
          AIRBNB_ICS_URL: ${{ secrets.AIRBNB_ICS_URL }}
      - name: Commit se mudou
        run: |
          git config user.name "studio215-bot"
          git config user.email "studio215-bot@users.noreply.github.com"
          git add assets/agenda.json
          git diff --cached --quiet && exit 0
          git commit -m "Agenda do Airbnb atualizada"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
